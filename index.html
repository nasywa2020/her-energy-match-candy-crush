function runs(b){
  const m=new Set();
  for(let r=0;r<N;r++)for(let c=0;c<N-2;c++){const i=r*N+c,v=b[i];if(v!=null&&v===b[i+1]&&v===b[i+2]){m.add(i);m.add(i+1);m.add(i+2)}}

  return m;
}
function moves(b){
  const out=[];
  for(let i=0;i<N*N;i++){
    for(const j of [i+1,i+N]){
      if(j>=N*N||(j===i+1&&(i%N)===N-1))continue;
      [b[i],b[j]]=[b[j],b[i]];const ok=runs(b).size>0;[b[i],b[j]]=[b[j],b[i]];
      if(ok)out.push([i,j]);
    }
  }
  return out;
}
function newBoard(){
  do{board=Array.from({length:N*N},rnd);
    while(runs(board).size){for(const i of runs(board))board[i]=rnd()}
  }while(!moves(board).length);
}
function render(){
  const el=$('board');el.innerHTML='';
  board.forEach((v,i)=>{
    const b=document.createElement('button');b.type='button';b.className='cell'+(sel===i?' sel':'')+(fallMap[i]?' fall':'');
    b.dataset.i=i;b.dataset.t=v;b.textContent=TILES[v].e;b.setAttribute('aria-label',NAMA[TILES[v].k]);
    if(fallMap[i])b.style.setProperty('--d',fallMap[i]);
    el.appendChild(b);
  });
  fallMap={};
}
function bump(k){const e=document.querySelector(`[data-s="${k}"] b`);if(e){e.classList.add('bump');setTimeout(()=>e.classList.remove('bump'),220)}}
function hud(){
  const d=DAYS[S.day];$('dayChip').textContent=d.chip;
  const pct=Math.min(100,Math.round(S.prog));$('prog').style.width=pct+'%';$('progTxt').textContent=pct+'%';
  $('stats').innerHTML=['pengetahuan','jaringan','suara','agency'].map(k=>`<div class="stat" data-s="${k}"><b>${Math.floor(S.st[k])}</b><span>${NAMA[k]}</span></div>`).join('');
  const col={energi:'--c-energi',waktu:'--c-waktu',uang:'--c-uang'};
  $('pools').innerHTML=['energi','waktu','uang'].map(k=>`<div class="pool">${NAMA[k]} ${Math.round(S.st[k])}<div><i style="width:${S.st[k]}%;background:var(${col[k]})"></i></div></div>`).join('');
}
function cheer(t){const c=$('cheer');c.textContent=t;c.classList.remove('show');void c.offsetWidth;c.classList.add('show')}
const CHEERS=['Mantap','Nice, lanjut','Smooth banget','Gas terus','Healing banget','Santai tapi jago'];
function reward(set){
  const cnt={};
  set.forEach(i=>{const k=TILES[board[i]].k;cnt[k]=(cnt[k]||0)+1});
  for(const k in cnt){
    if(['energi','waktu','uang'].includes(k))S.st[k]=Math.min(100,S.st[k]+cnt[k]*2.5);
    else S.st[k]+=cnt[k]*PTS;
  }
  if(set.size>=5)S.st.agency+=0.5*(set.size-4);
  S.prog+=set.size/TARGET*100;S.cleared+=set.size;
}
async function resolve(){
  let chain=0;
  for(;;){
    const m=runs(board);if(!m.size)break;
    chain++;reward(m);hud();sfx(chain);
    m.forEach(i=>{const e=$('board').children[i];if(e)e.classList.add('pop')});
    if(chain>1||m.size>=5)cheer(m.size>=5?'Combo besar':CHEERS[Math.floor(Math.random()*CHEERS.length)]);
    await sleep(230);
    for(let c=0;c<N;c++){
      const keep=[];for(let r=N-1;r>=0;r--){if(!m.has(r*N+c))keep.push(board[r*N+c])}
      const add=N-keep.length;
      for(let r=N-1;r>=0;r--){
        const idx=N-1-r,i=r*N+c;
        if(idx<keep.length){if(board[i]!==keep[idx]||m.has(i)){fallMap[i]=Math.max(1,add)}board[i]=keep[idx]}
        else{board[i]=rnd();fallMap[i]=N-r}
      }
    }
    render();await sleep(420);
  }
  if(!moves(board).length){cheer('Papan diacak ulang');newBoard();render();await sleep(300)}
}
async function swap(a,b){
  if(busy)return;
  const ra=Math.floor(a/N),rb=Math.floor(b/N),ca=a%N,cb=b%N;
  if(Math.abs(ra-rb)+Math.abs(ca-cb)!==1)return;
  busy=true;sel=null;
  [board[a],board[b]]=[board[b],board[a]];
  if(!runs(board).size){
    render();await sleep(120);[board[a],board[b]]=[board[b],board[a]];render();busy=false;return;
  }
  render();await sleep(100);
  await resolve();
  busy=false;
  if(S.prog>=100){await sleep(250);showEvent()}
}
function pick(i){
  if(busy)return;
  if(sel===null){sel=i;render();return}
  if(sel===i){sel=null;render();return}
  const a=sel;sel=null;render();swap(a,i);
}
let drag=null;
$('board').addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(!c)return;drag={i:+c.dataset.i,x:e.clientX,y:e.clientY,moved:false}});
window.addEventListener('pointermove',e=>{
  if(!drag||drag.moved)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<16)return;
  drag.moved=true;
  const i=drag.i,j=Math.abs(dx)>Math.abs(dy)?i+(dx>0?1:-1):i+(dy>0?N:-N);
  if(j>=0&&j<N*N)swap(i,j);
});
window.addEventListener('pointerup',()=>{if(drag&&!drag.moved)pick(drag.i);drag=null});
window.addEventListener('pointercancel',()=>{drag=null});
$('hintBtn').onclick=()=>{
  if(busy)return;const m=moves(board);if(!m.length)return;
  const [a,b]=m[Math.floor(Math.random()*m.length)];
  [a,b].forEach(i=>$('board').children[i].classList.add('hint'));
};
function showSheet(html){$('card').innerHTML=html;$('sheet').hidden=false;$('card').scrollTop=0}
function lockReason(o){
  const r=o.req;if(!r)return null;
  if(r.flagNot&&S.flags[r.flagNot])return r.lock;
  if(r.min)for(const k in r.min)if(S.st[k]<r.min[k])return r.lock;
  return null;
}
function lackReason(o){
  if(!o.cost)return null;
  for(const k in o.cost)if(S.st[k]<o.cost[k])return 'Bekal '+NAMA[k]+' kurang, match dulu ya';
  return null;
}
function fmt(obj,sign){return Object.entries(obj||{}).filter(([,v])=>v).map(([k,v])=>`${sign}${v} ${NAMA[k]}`)}
function showEvent(){
  const d=DAYS[S.day];
  const opts=d.o.map((o,i)=>{
    const lock=lockReason(o),lack=lackReason(o);
    const tags=[...fmt(o.g,'+').map(t=>`<span class="tag">${t}</span>`),...fmt(o.cost,'-').map(t=>`<span class="tag cost">${t}</span>`)];
    if(lock)tags.push(`<span class="tag lock">${lock}</span>`);else if(lack)tags.push(`<span class="tag lock">${lack}</span>`);
    return `<button class="opt" type="button" data-o="${i}" ${lock||lack?'disabled':''}><strong>${o.t}</strong><small>${o.d}</small><div class="tags">${tags.join('')}</div></button>`;
  }).join('');
  showSheet(`<div class="eyebrow">${d.tag}</div><h2>${d.q}</h2><p>${d.p}</p><div class="opts">${opts}</div>`);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.o));
}
function choose(i){
  const d=DAYS[S.day],o=d.o[i];
  for(const k in o.cost)S.st[k]-=o.cost[k];
  for(const k in o.g)S.st[k]=Math.min(100,S.st[k]+o.g[k]);
  if(o.flag)S.flags[o.flag]=true;
  const last=S.day===DAYS.length-1;
  let note='';
  if(S.day===0&&o.flag==='skipForum')note='<em>Catatan: pilihan ini bisa bikin beberapa opsi di hari-hari berikutnya belum terbuka. Plot twist menanti.</em>';
  if(S.day===2&&S.flags.skipForum&&i===0)note='<em>Pelatihan usaha nggak terbuka karena kamu skip forum di Hari 1. Efek domino dari pilihan awal tadi.</em>';
  showSheet(`<div class="eyebrow">Hasil pilihanmu</div><h2>${o.t}</h2><div class="fb">${o.fb}${note}</div><div class="tags">${fmt(o.g,'+').map(t=>`<span class="tag">${t}</span>`).join('')}</div><button class="btn main" id="nextBtn" type="button">${last?'Lihat perjalanan Rani':'Lanjut ke hari berikutnya'}</button>`);
  hud();
  $('nextBtn').onclick=()=>last?ending():nextDay();
}
function nextDay(){
  S.day++;S.prog=0;
  S.st.energi=Math.min(100,S.st.energi+15);S.st.waktu=Math.max(S.st.waktu,60);
  $('sheet').hidden=true;
  $('dayHint').textContent=DAYS[S.day].tag+': match tiles buat ngisi bekal';
  hud();cheer('Hari '+(S.day+1));
}
function endingType(){
  const s=S.st;
  if(s.pengetahuan>=40&&s.jaringan>=30&&s.suara>=30&&s.agency>=22)return 'change';
  if(s.jaringan>=28&&s.suara>=26)return 'voice';
  if(s.pengetahuan>=32)return 'informed';
  return 'observer';
}
function ending(){
  const e=ENDINGS[endingType()],s=S.st;
  const on=[s.pengetahuan>=10,S.flags.docs||s.pengetahuan>=22,s.jaringan>=15,s.suara>=15,s.suara>=25&&s.agency>=14,s.agency>=20];
  const bar=(k)=>`<div class="row"><span>${NAMA[k]}</span><div><i style="width:${Math.min(100,s[k])}%"></i></div><span>${Math.floor(s[k])}</span></div>`;
  showSheet(`<div class="eyebrow">Perjalanan selesai</div><h2>${e.n}</h2><p>${e.d}</p>
  <div class="res">${['pengetahuan','jaringan','suara','agency'].map(bar).join('')}</div>
  <div class="steps">${POWER.map((p,i)=>`<span class="${on[i]?'on':''}">${p}</span>`).join('')}</div>
  <div class="fb">Nggak ada menang atau kalah di sini, cuma perjalanan yang beda-beda. Dari semua pilihanmu, mana yang paling kerasa dampaknya buat Rani?<em>Prototipe pembelajaran Her Energy: PLTS Cirata, gender, dan kehidupan komunitas.</em></div>
  <button class="btn main" id="againBtn" type="button">Main lagi</button>`);
  $('againBtn').onclick=start;
}
function start(){
  S=fresh();busy=false;sel=null;newBoard();render();hud();
  $('sheet').hidden=true;$('dayHint').textContent=DAYS[0].tag+': match tiles buat ngisi bekal';
}
/* Backsound lo-fi dibuat dengan Web Audio, tanpa file eksternal */
let AC=null,musicOn=false,master,bus,sfxBus,mTimer=null,nextT=0,barN=0,autoTried=false;
const BPM=76,BEAT=60/BPM,mf=m=>440*Math.pow(2,(m-69)/12);
const PROG=[{b:36,c:[48,55,59,64]},{b:33,c:[45,52,55,60]},{b:29,c:[41,48,52,57]},{b:31,c:[55,59,62,64]}];
const ARP=[0,2,1,3,2,3,1,2],PENTA=[72,74,76,79,81,84];
function tone(f,t,dur,type,vol,dest,att){
  att=att||0.01;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);
}
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  bus=AC.createGain();const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
  bus.connect(lp);lp.connect(master);
  const dl=AC.createDelay(1),fb=AC.createGain(),dg=AC.createGain();dl.delayTime.value=BEAT*0.75;fb.gain.value=0.32;dg.gain.value=0.4;
  lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(dg);dg.connect(master);
  sfxBus=AC.createGain();sfxBus.connect(master);
}
function scheduleBar(t){
  const p=PROG[barN%4];
  p.c.forEach(n=>tone(mf(n),t,BEAT*4,'triangle',0.035,bus,0.5));
  tone(mf(p.b),t,BEAT*1.8,'sine',0.14,bus,0.02);
  tone(mf(p.b),t+BEAT*2.5,BEAT*1.2,'sine',0.08,bus,0.02);
  ARP.forEach((ix,k)=>{if(Math.random()<0.85)tone(mf(p.c[ix]+12),t+k*BEAT/2+(k%2?0.03:0),BEAT*0.9,'sine',0.045,bus,0.01)});
  barN++;
}
function sfx(chain){
  if(!AC||!musicOn)return;
  const n=PENTA[Math.min(chain-1,PENTA.length-1)],t=AC.currentTime;
  tone(mf(n),t,0.28,'sine',0.1,sfxBus,0.005);tone(mf(n+7),t+0.07,0.28,'sine',0.06,sfxBus,0.005);
}
function toggleMusic(){
  if(!AC)initAudio();
  if(AC.state==='suspended')AC.resume();
  musicOn=!musicOn;const t=AC.currentTime;
  master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);
  if(musicOn){
    master.gain.linearRampToValueAtTime(0.6,t+1.2);nextT=t+0.1;barN=0;
    mTimer=setInterval(()=>{while(nextT<AC.currentTime+0.6){scheduleBar(nextT);nextT+=BEAT*4}},120);
  }else{master.gain.linearRampToValueAtTime(0,t+0.4);clearInterval(mTimer)}
  
}
const tl=n=>`<span class="cell" data-t="${n}" style="width:46px;height:46px;font-size:24px">${TILES[n].e}</span>`;
const TUT=[
 {h:'Kenalan dulu sama Rani',demo:'',p:'Rani, 35 tahun, ibu rumah tangga sekaligus pelaku usaha kecil di desa sekitar Waduk Cirata. Tujuh hari ke depan, kamu yang pegang kemudi. Lagi ada proyek PLTS di desa, dan Rani kepo banget.'},
 {h:'Cara mainnya gampang, kok',demo:`<div style="display:flex;gap:4px;justify-content:center">${tl(3)}${tl(0)}${tl(3)}${tl(3)}</div>`,p:'Geser satu tile ke sebelahnya, atau tap dua tile yang bersebelahan. 3 tile sejenis atau lebih berjajar? Pecah, dan Rani dapat bekal. Salah geser? Tile balik sendiri. Nggak ada nyawa, nggak ada timer, nggak ada yang ngomel.'},
 {h:'Tiap tile ada artinya',demo:`<div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap">${[0,1,2,3,4,5].map(tl).join('')}</div>`,p:'Energi, Waktu, dan Uang adalah bekal buat bayar pilihan. Pengetahuan, Jaringan, dan Suara bikin posisi Rani makin kuat di desa. Agency naik dari match besar (5 tile atau lebih) dan dari pilihan yang berani.'},
 {h:'Pertanyaannya nongol sendiri',demo:'',p:'Isi bar progres sampai penuh, lalu Rani bakal ketemu situasi seru dengan 4 pilihan. Nggak ada jawaban benar atau salah, bebas mau gaya yang mana. Tapi awas: pilihan hari ini bisa membuka atau menutup pilihan di hari-hari berikutnya.'}
];
function showTutorial(i){
  const s=TUT[i],last=i===TUT.length-1;
  showSheet(`<div class="eyebrow">Tutorial · ${i+1} dari ${TUT.length}</div><h2>${s.h}</h2>${s.demo}<p>${s.p}</p><div class="steps">${TUT.map((_,k)=>`<span class="${k<=i?'on':''}" style="width:24px;height:8px;padding:0"></span>`).join('')}</div><div style="display:flex;gap:8px">${i?'<button class="btn" id="tBack" type="button">Kembali</button>':''}<button class="btn main" id="tNext" type="button" style="flex:1">${last?'Gas, mulai Hari 1':'Lanjut'}</button></div>`);
  if(i)$('tBack').onclick=()=>showTutorial(i-1);
  $('tNext').onclick=()=>{
    if(!last)return showTutorial(i+1);
    try{if(!musicOn)toggleMusic()}catch(err){}
    $('sheet').hidden=true;
  };
}
start();
showTutorial(0);
</script>
